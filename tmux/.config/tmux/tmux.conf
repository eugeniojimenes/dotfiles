## NOTE: Default settings for Omarchy with diferent prefix key, and some additional settings for my personal use.
#        You can copy the ones you like, or just use the whole file as your tmux.conf

# Prefix
# set -g prefix C-Space
set -g prefix C-\\
set -g prefix2 C-b
# bind C-Space send-prefix
bind C-\\ send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
# Alacritty is the terminal here and sets TERM=xterm-256color (alacritty.toml), so the kitty pattern above never
# matches and extended-keys stays inert without this line. Alacritty speaks the kitty keyboard protocol since 0.13.
# Keep the kitty line too: omarchy's migration greps for it and would re-inject it otherwise.
set -ag terminal-features "xterm-256color:extkeys"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# set -g status-left "#[fg=white,bg=blue,bold] #S #[bg=default] " # NOTE: for space-monkey theme
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
# set -g mode-style "bg=blue,fg=white" # NOTE: for space-monkey theme
setw -g clock-mode-colour blue
## End of default settings for Omarchy

## Additional settings to my personal use:
bind -n M-n new-window                                    # ALT + n: New window
bind -n M-w kill-window                                   # ALT + w: Close window
bind-key -n M-= swap-window -t +1 \; select-window -t:+1  # ALT + =: "move" window to next index
bind-key -n M-- swap-window -t -1 \; select-window -t:-1  # ALT + -: "move" window to previous index

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btop lazydocker lazygit htop'
# Snapshot retention. resurrect prunes on every save (remove_old_backups in save.sh): drops files older than this many
# days, always keeping the 5 newest. Default is 30, which is a lot of files at a 5-minute save interval.
set -g @resurrect-delete-backup-after '7'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# NOTE: no multi-server guard needed here. Continuum checks, at plugin load only, whether another tmux server is
# already running; if so it installs no save hook and skips auto-restore. The isolated servers from
# `~/.config/hypr/tmux-launch.sh` therefore opt themselves out, and the primary (always the first to start) is
# unaffected by them.

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Plugins live outside ~/.config/tmux on purpose: that keeps this directory a single file, so stow can link
# `~/.config/tmux` as a *directory*. A directory link survives omarchy's `sed -i` migrations, which replace a
# file-level symlink with a regular copy and silently detach it from this repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
run '~/.local/share/tmux/plugins/tpm/tpm'
## TPM commands:
# prefix + I : Install plugins
# prefix + U: Update plugins
# prefix + alt + u: Remove/uninstall plugins not on here
