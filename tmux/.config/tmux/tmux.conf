# tmux config. Every binding carries -N "description": `prefix + ?` lists them (tmux list-keys -N).

# Prefix: Ctrl+\, with Ctrl+b kept as a second one.
set -g prefix C-\\
set -g prefix2 C-b
bind -N "Send prefix" C-\\ send-prefix
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys -N | less"

# Copy mode with vi keys: v starts the selection, y copies and leaves.
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Panes. Splits open in the current pane's directory. Alt chords work without the prefix.
bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Windows. Alt+1..9 jumps, Alt+arrows walk, Alt+Shift+arrows (or Alt+- / Alt+=) move the window itself.
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window
bind -N "Choose window from a list" w choose-tree -Zw
bind -N "Create window" -n M-n new-window
bind -N "Kill window" -n M-w kill-window
bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1
bind -N "Move window left" -n M-- swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-= swap-window -t +1 \; select-window -t +1
bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

# Sessions
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Choose session from a list" s choose-tree -Zs
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Behaviour. Numbering from 1 to match the keyboard; killing the last window of a session moves to another session
# instead of detaching.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g detach-on-destroy off
setw -g aggressive-resize on
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Terminal: true color, focus events for Neovim, OSC 52 clipboard (also for remote Neovim yanks), passthrough.
# Extended keys (kitty protocol, Alacritty >= 0.13): Alacritty sets TERM=xterm-256color, hence that pattern.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -as terminal-features ",*:clipboard"
set -ag terminal-features "xterm-256color:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -sg escape-time 10

# Status bar on top, terminal colors only: session on blue at the left, mode flags and host at the right.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-separator ""
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Snapshots are entirely manual: `prefix + Ctrl-s` saves, `prefix + Ctrl-r` restores. tmux-continuum used to drive
# both on a timer and is deliberately gone. Once auto-restore was off, its auto-save became actively harmful: the
# first server of the day starts empty, so five minutes later it would write that emptiness over the snapshot the
# restore was meant to bring back. Saving on purpose is the only version of this that is not a race.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Restore the shape of the workspace, never the programs. A restore brings back sessions, windows, pane layouts,
# each pane's cwd and (thanks to capture-pane-contents above) its scrollback, but relaunches nothing, so no editor
# reopens a buffer you had already walked away from.
#
# 'false' is a sentinel, not a list entry: restore_pane_processes_enabled() in process_restore_helpers.sh tests for
# that exact string and skips the whole restore_all_pane_processes loop. Naming programs here would do the opposite
# of what it looks like: the option is *additive*, _restore_list() echoes "$default_proc_list $user_processes",
# and the built-in default list already carries nvim, vim, htop and friends. There is no way to subtract from it.
set -g @resurrect-processes 'false'
# Snapshot retention. resurrect prunes on every save (remove_old_backups in save.sh): drops files older than this many
# days, always keeping the 5 newest.
set -g @resurrect-delete-backup-after '7'

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Plugins live outside ~/.config/tmux on purpose: that keeps this directory a single file, so stow links
# `~/.config/tmux` as a *directory* and anything editing tmux.conf in place edits this repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
run '~/.local/share/tmux/plugins/tpm/tpm'
## TPM commands:
# prefix + I : Install plugins
# prefix + U: Update plugins
# prefix + alt + u: Remove/uninstall plugins not on here
