[main]
font=JetBrainsMono Nerd Font:size=12
icon-theme=Yaru-dark
icons-enabled=yes
terminal=alacritty -e
prompt="  "
width=44
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=26
layer=overlay
# Stay open when the pointer moves over another window; Esc closes.
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=no

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=89b4faff
placeholder=6c7086ff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=10
