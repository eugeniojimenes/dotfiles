[settings]
idiomatic_version_file_enable_tools = ["ruby"]
experimental = true
# mise defaults to compiling Node, Python and Ruby on NixOS (prebuilt binaries need a /lib64 loader). nix-ld provides
# one (nixos/common.nix), so prebuilt works and skips the compilers and -dev libraries NixOS does not have.
all_compile = false
disable_tools = ["bundler"]
# Supply-chain cooldown: install and upgrade only releases published 7 days ago or more (most malicious releases are
# pulled within a week). Explicit: the built-in default is 24h only.
minimum_release_age = "7d"

[settings.ruby]

[env]
CFLAGS = "-std=gnu17"

[tools]
# Agent CLIs auto_update daily, held back by minimum_release_age above. Option from mise 2026.10.4 on (mise comes from
# nixpkgs-unstable, see flake.nix): older ones ignore it, then only `mise upgrade` moves them.
claude = { version = "latest", auto_update = true }
# Search past Claude Code sessions (not in nixpkgs; prebuilt release binary).
"github:raine/claude-history" = "latest"
gh = "latest"
glab = "latest"
go = "latest"
# postinstall pulls from npm, PyPI and RubyGems with no release-age wait: only what is needed (pnpm/yarn shims, ruby-lsp
# per Ruby for the LSP, bundler). No Neovim host packages: providers off in lazyvim options.lua.
node = { version = "22", postinstall = "corepack enable" }
opencode = { version = "latest", auto_update = true }
python = "3.11.13"
ruby = { version = "3.4.5", postinstall = "gem install bundler ruby-lsp" }
rust = "latest"
uv = "latest"
