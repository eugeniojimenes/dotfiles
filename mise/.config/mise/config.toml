[settings]
idiomatic_version_file_enable_tools = ["ruby"]
experimental = true
disable_tools = ["bundler"]

[settings.ruby]

[settings.upgrade]
auto_prune = false

[env]
CFLAGS = "-std=gnu17"

[tools]
# Agent CLIs auto_update daily but keep mise's default 24h minimum_release_age: a fresh release waits a day, the
# window in which compromised npm releases usually get pulled.
claude = { version = "latest", auto_update = true }
gh = "latest"
oh-my-pi = { version = "latest", auto_update = true }
glab = "latest"
go = "latest"
node = { version = "22", postinstall = "corepack enable; npm install -g neovim" }
opencode = { version = "latest", auto_update = true }
python = { version = "3.11.13", postinstall = "pip install --upgrade pip; pip install neovim" }
ruby = { version = "3.4.5", postinstall = "gem install bundler neovim" }
rust = "latest"
uv = "latest"
