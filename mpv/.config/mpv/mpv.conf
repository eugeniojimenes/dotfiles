vo=gpu
# Vulkan (mpv's default API) loads every GPU's driver at start: on the notebook it wakes the sleeping NVIDIA card and
# costs about 1 s before the first frame. OpenGL renders on the iGPU alone, in about 0.2 s.
# `prime-run mpv --gpu-api=vulkan <file>` plays on the NVIDIA card anyway.
gpu-api=opengl
target-colorspace-hint=no
