screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker

    # 2 = EMBEDDED. xdph defaults to HIDDEN, rejects METADATA, and WebRTC apps (Chrome, Slack)
    # never ask for EMBEDDED. Drop this line and every share goes out cursorless. Trace: CLAUDE.md.
    cursor_mode = 2
}
