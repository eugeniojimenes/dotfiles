$browser = uwsm-app -- brave --new-window --ozone-platform=wayland

bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --incognito
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER SHIFT, D, Lazy Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
# bindd = SUPER SHIFT, T, btop (A monitor of resources), exec, $terminal -e btop
bindd = SUPER SHIFT, T, Activity monitor (btop), exec, omarchy-launch-tui btop

bindd = SUPER SHIFT, L, Lock Screen, exec, omarchy-lock-screen

bindd = ALT, TAB, Cycling between the last two worked workspaces, workspace, previous
bindd = SHIFT ALT, TAB, Cycling last worked workspaces: previous, workspace, e-1

bindd = SUPER SHIFT, M, Move entire workspace to other monitor, movecurrentworkspacetomonitor, +1
